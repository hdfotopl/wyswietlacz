            }
          }

          it.printf(
            110, 30,
            id(font_f1),
            Color(r, g, b),
            TextAlign::LEFT,
            "%s",
            opona_1.c_str()
          );
        }
        it.printf(140, 30, id(font_f1), "Leader");

          // Drugi zawodnik wyścigu w dynamicznym kolorze
