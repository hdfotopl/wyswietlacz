# Konfiguracja sprzętowej magistrali SPI
spi:
  clk_pin: GPIO4
  mosi_pin: GPIO3

# Synchronizacja czasu z Home Assistant
time:
  - platform: homeassistant
    id: home_time

# Czcionki
font:
  - file: "gfonts://Roboto"
    id: font_zegar
    size: 68
    glyphs: "0123456789:"

  - file: "gfonts://Roboto"
    id: font_f1
    size: 20
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ĄĆĘŁŃÓŚŹŻąćęłńóśźż:-/,+. "

  - file: "gfonts://Roboto"
    id: font_f1_laps
    size: 45
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789ĄĆĘŁŃÓŚŹŻąćęłńóśźż:-/ "

  - file: "gfonts://Roboto"
    id: font_flag_status
    size: 44
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ "

# Pobieranie danych o okrążeniach z Home Assistant
sensor:
  - platform: homeassistant
    id: f1_current_lap
    entity_id: sensor.f1_race_lap_count

  - platform: homeassistant
    id: f1_total_laps
    entity_id: sensor.f1_race_lap_count
    attribute: total_laps

# Konfiguracja wyświetlacza GC9A01A przez MIPI SPI
display:
  - platform: mipi_spi
    model: GC9A01A

    cs_pin: GPIO1
    dc_pin: GPIO10
    reset_pin: GPIO0

    rotation: 0°
    invert_colors: true

    color_depth: 16
    data_rate: 20MHz
    buffer_size: 25%

    update_interval: 1s
    lambda: |-
      auto now = id(home_time).now();

      if (!now.is_valid()) {
        it.fill(Color(0, 0, 0));
        return;
      }

      std::string session = id(f1_session_type).state;

      if (session == "Race" || session == "Sprint Qualifying" || session == "Sprint" || session == "Qualifying") {
        std::string track_status = id(f1_track_status).state;

        // --- OBSŁUGA FLAG NA TORZE ---
        if (track_status == "YELLOW" || track_status == "VSC" || track_status == "SC") {
          // Cały ekran w kolorze żółtym, czarny napis na środku
          it.fill(Color(255, 200, 0));
          it.printf(
            120, 120,
            id(font_flag_status),
            Color(0, 0, 0),
            TextAlign::CENTER,
            "%s",
            track_status.c_str()
          );

        } else if (track_status == "RED") {
          // Cały ekran w kolorze czerwonym, biały napis na środku
          it.fill(Color(255, 0, 0));
          it.printf(
            120, 120,
            id(font_flag_status),
            Color(255, 255, 255),
            TextAlign::CENTER,
            "RED FLAG"
          );

        } else {
          // --- TRYB STANDARDOWY (CLEAR / NORMALNY WYŚCIG) ---
          it.fill(Color(0, 0, 0));

        // Lider wyścigu w dynamicznym kolorze
        std::string leader = id(f1_leader_tla).state;
        std::string hex_color = id(f1_leader_color).state;

        if (!leader.empty() && leader != "---") {
          uint8_t r = 255, g = 255, b = 255;

          // Parsowanie formatu HEX lub RGB [R, G, B]
          if (hex_color.length() == 6) {
            unsigned int hex_val = std::stoul(hex_color, nullptr, 16);
            r = (hex_val >> 16) & 0xFF;
            g = (hex_val >> 8) & 0xFF;
            b = hex_val & 0xFF;
          } else if (!hex_color.empty()) {
            int tr = 255, tg = 255, tb = 255;
            if (sscanf(hex_color.c_str(), "[%d, %d, %d]", &tr, &tg, &tb) == 3) {
              r = tr; g = tg; b = tb;
            }
          }

          it.printf(
            30, 30,
            id(font_f1),
            Color(r, g, b),
            TextAlign::LEFT,
            "P1 %s",
            leader.c_str()
          );
        }
        // P1 opony
        std::string opona_1 = id(f1_1_pit).state;
        std::string kolor_opona_1 = id(f1_1_pit_kolor).state;

        if (!opona_1.empty() && opona_1 != "---") {
          uint8_t r = 255, g = 255, b = 255;

          // Parsowanie formatu HEX lub RGB [R, G, B]
          if (kolor_opona_1.length() == 6) {
            unsigned int hex_val = std::stoul(kolor_opona_1, nullptr, 16);
            r = (hex_val >> 16) & 0xFF;
            g = (hex_val >> 8) & 0xFF;
            b = hex_val & 0xFF;
          } else if (!kolor_opona_1.empty()) {
            int tr = 255, tg = 255, tb = 255;
            if (sscanf(kolor_opona_1.c_str(), "[%d, %d, %d]", &tr, &tg, &tb) == 3) {
